[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoforecast"
version = "0.1.0"
description = "A leak-free walk-forward study of short-horizon crypto return predictability."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ITheClixs" }]
keywords = [
    "quantitative-finance",
    "walk-forward",
    "backtesting",
    "market-efficiency",
    "time-series",
    "cryptocurrency",
]

# Runtime dependencies. Lower bounds are the versions this repo is tested against;
# `make backtest` reproduces the committed results on these.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "yfinance>=0.2.50",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
demo = ["flask>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
cryptoforecast = "cryptoforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptoforecast = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PD", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["cryptoforecast"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true  # yfinance / xgboost / matplotlib ship no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `app` is the demo server, deliberately not part of the installed distribution.
# Without this, `pytest` (console script) cannot import it while `python -m pytest` can.
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "integration: touches the network or the full pipeline",
]

[tool.coverage.run]
source = ["cryptoforecast"]
branch = true
